micronaut:
  application:
    name: user-service
  security:
    # Secure by default: callers authenticate with an Auth0 access token (RS256) as a bearer token. This service never sees a password and
    # issues nothing: it checks the signature against Auth0's published keys (JWKS, fetched and cached by Micronaut Security), the issuer,
    # the audience (this API's identifier in Auth0) and the expiry. Set AUTH0_DOMAIN (e.g. your-tenant.eu.auth0.com) and AUTH0_AUDIENCE.
    authentication: bearer
    token:
      # Auth0's `sub` ("auth0|64f...") is not a UUID, but a user is a UUID here and in the live communication service. A post-login Action
      # stores one UUID per user and puts it in the access token under this claim (see README); it becomes the caller's id.
      name-key: ${AUTH0_USER_ID_CLAIM:https://jtalk.app/user_id}
      jwt:
        signatures:
          jwks:
            auth0:
              url: https://${AUTH0_DOMAIN}/.well-known/jwks.json
        claims-validators:
          issuer: https://${AUTH0_DOMAIN}/
          audience: ${AUTH0_AUDIENCE}
  server:
    # A browser app on another origin (the frontend) may call this API. Origins are matched as a regular expression: any origin until
    # CORS_ALLOWED_ORIGINS narrows it to your frontend, e.g. CORS_ALLOWED_ORIGINS='https://app\.example\.com|http://localhost:4200'.
    # Callers authenticate with a header, not a cookie, so an open list exposes no one's session.
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins-regex: ${CORS_ALLOWED_ORIGINS:.*}
          allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allowed-headers: [Authorization, Content-Type, X-User-Id]
          max-age: 3600

# PostgreSQL and Redis connections are intentionally NOT configured here:
#  - locally (./gradlew run, tests) Micronaut Test Resources starts containers for them;
#  - deployed, set DATASOURCES_DEFAULT_URL / _USERNAME / _PASSWORD and REDIS_URI (see render.yaml).
# user.* tunables have defaults in UserProperties.
datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver
    # Fail fast when the database is down: Hikari's default is 30 s, which keeps probes and callers hanging.
    connection-timeout: 3000

flyway:
  datasources:
    default:
      enabled: true
      # The service owns the "user_service" schema everywhere (the entities name it), so a local database looks like the deployed one,
      # where the schema keeps this service apart from the live communication service sharing the Neon database.
      create-schemas: true
      default-schema: user_service
      schemas: [user_service]

# Health probes for the load balancer or orchestrator. /health answers without a token (a probe carries none), but anonymous callers
# get only the overall status: the details (database) are for authenticated callers.
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED

# Render Blueprint (https://render.com/docs/blueprint-spec): New > Blueprint, pick this repository. Render builds the Dockerfile,
# which already runs with the "cloud" profile (MICRONAUT_ENVIRONMENTS=cloud) and tells the service which port to bind through PORT
# (application-cloud.yml reads it).
services:
  - type: web
    name: jtalk-user-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Same region as the live communication service and its Neon database (us-east-2, which is Ohio).
    region: ohio
    branch: main
    autoDeployTrigger: commit
    # Liveness only: it answers without a token and does not depend on the database, so a slow Neon wake-up never restarts the service.
    healthCheckPath: /health/liveness
    envVars:
      # Auth0: users log in there and this service only checks the access tokens it issues. AUTH0_DOMAIN is the tenant's domain without
      # https://, e.g. your-tenant.eu.auth0.com; AUTH0_AUDIENCE is the identifier of the API created in Auth0 for this service.
      # Render asks for both when the Blueprint is created.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      # Optional: restrict which frontend may call this API (a regular expression). Any origin until set, e.g.
      # https://app\.example\.com|http://localhost:4200
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # PostgreSQL is not set here: the "cloud" profile (application-cloud.yml) uses the same Neon database as the live communication
      # service, in a schema of its own (user_service).

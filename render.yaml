# Render Blueprint (https://render.com/docs/blueprint-spec): New > Blueprint, pick this repository. Render builds the Dockerfile,
# which already runs with the "cloud" profile (MICRONAUT_ENVIRONMENTS=cloud) and tells the service which port to bind through PORT
# (application-cloud.yml reads it).
services:
  - type: web
    name: jtalk-user-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Same region as the live communication service and its Neon database (us-east-2, which is Ohio).
    region: ohio
    branch: main
    autoDeployTrigger: commit
    # Liveness only: it answers without a token and does not depend on the database, so a slow Neon wake-up never restarts the service.
    healthCheckPath: /health/liveness
    envVars:
      # Temporary: Micronaut Security logs why it rejects a token (bad signature, issuer, audience, expiry, a missing user-id claim) at DEBUG.
      # Remove this once sign-in works, so the log stays quiet.
      - key: LOGGER_LEVELS_IO_MICRONAUT_SECURITY
        value: DEBUG
      # Auth0: users log in there and this service only checks the access tokens it issues (signature, issuer, audience, expiry). Neither
      # value is a secret, so both are set here: AUTH0_DOMAIN is the tenant's domain without https://, and AUTH0_AUDIENCE is the identifier of
      # the API created in Auth0 for this service (APIs > Create API; the identifier is just a name, it does not have to resolve).
      - key: AUTH0_DOMAIN
        value: dev-fffl5f080xabhazz.us.auth0.com
      - key: AUTH0_AUDIENCE
        value: https://api.jtalk.app
      # Which frontend may call this API, as a regular expression: the deployed app on Vercel and the local dev server. (Vercel preview
      # deployments have other host names, so they are refused until added here.)
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://jtalk-mocha\.vercel\.app|http://localhost:4200'
      # PostgreSQL is not set here: the "cloud" profile (application-cloud.yml) uses the same Neon database as the live communication
      # service, in a schema of its own (user_service).
